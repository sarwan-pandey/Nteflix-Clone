<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=============== REMIXICONS ===============-->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets 1/css/styles.css">

    <title>Animated Signup Form - Bedimcode</title>
</head>
<body>
    <div class="login">
        <img src="assets 1/img/login-bg.png" alt="signup image" class="login__img">

        <form action="" class="login__form">
            <h1 class="login__title">Sign Up</h1>

            <div class="login__content">
                <div class="login__box">
                    <i class="ri-user-3-line login__icon"></i>

                    <div class="login__box-input">
                        <input type="text" required class="login__input" id="signup-username" placeholder=" ">
                        <label for="signup-username" class="login__label">Username</label>
                    </div>
                </div>

                <div class="login__box">
                    <i class="ri-mail-line login__icon"></i>

                    <div class="login__box-input">
                        <input type="email" required class="login__input" id="signup-email" placeholder=" ">
                        <label for="signup-email" class="login__label">Email</label>
                    </div>
                </div>

                <div class="login__box">
                    <i class="ri-lock-2-line login__icon"></i>

                    <div class="login__box-input">
                        <input type="password" required class="login__input" id="signup-pass" placeholder=" ">
                        <label for="signup-pass" class="login__label">Password</label>
                        <i class="ri-eye-off-line login__eye" id="signup-eye"></i>
                    </div>
                </div>

                <div class="login__box">
                    <i class="ri-lock-2-line login__icon"></i>

                    <div class="login__box-input">
                        <input type="password" required class="login__input" id="signup-confirm-pass" placeholder=" ">
                        <label for="signup-confirm-pass" class="login__label">Confirm Password</label>
                        <i class="ri-eye-off-line login__eye" id="signup-confirm-eye"></i>
                    </div>
                </div>
            </div>

            <div class="login__check">
                <div class="login__check-group">
                    <input type="checkbox" class="login__check-input" id="signup-check">
                    <label for="signup-check" class="login__check-label">I agree to the terms and conditions</label>
                </div>
            </div>

            <button type="submit" class="login__button">Sign Up</button>

            <p class="login__register">
                Already have an account? <a href="Login.html">Login</a>
            </p>
        </form>
    </div>

    <!--=============== MAIN JS ===============-->
    <script src="assets 1/js/main.js"></script>
</body>
</html>
